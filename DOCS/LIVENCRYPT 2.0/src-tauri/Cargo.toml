[package]
name = "livencrypt-core"
version = "2.11.0"
description = "Livencrypt 2.0 - Texto, archivo y editor de plantillas"
authors = ["Synergia86"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "livencrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
rmp-serde = "1.3"
hex = "0.4"
flate2 = "1.0"
url = "2.5.8"
tauri-plugin-dialog = "2.7.1"
opener = "0.8.4"
rayon = "1.12.0"
zstd = "0.13.3"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
