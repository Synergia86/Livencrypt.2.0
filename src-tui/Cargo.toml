[package]
name = "livencrypt-core"
version = "2.11.0"
description = "Livencrypt 2.0 - Texto, archivo y editor de plantillas"
authors = ["Synergia86"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "livencrypt_lib"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
rand = "0.8"
rmp-serde = "1.3"
hex = "0.4"
bs58 = "0.5"
flate2 = "1.0"
rayon = "1.12.0"
zstd = "0.13.3"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
itoa = "1.0"
secrecy = "0.8"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
serde_json = "1.0"
secp256k1 = { version = "0.29", features = ["global-context", "rand", "recovery"] }
libc = "0.2"
ratatui = "0.30"
crossterm = "0.27"
ed25519-dalek = "2.1"
hmac = "0.12"
rust_decimal = "1.35"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.4"
